name: release

# Pushing a tag vX.Y.Z builds the APK, signs it with the project's release key (repository secrets) and attaches it to
# the GitHub release of that tag (created if missing).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-33" > /dev/null
      - name: Third-party sources
        run: tools/setup.sh
      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KS_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE="$RUNNER_TEMP/release.jks" KEY_ALIAS=recomp tools/build_apk.sh
          rm -f "$RUNNER_TEMP/release.jks"
          cp build/xenobladeport.apk "build/xenobladeport-${GITHUB_REF_NAME}.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Xenoblade DE port $GITHUB_REF_NAME" \
              --notes "Install the APK, then follow the README: you need your own extracted game files."
          gh release upload "$GITHUB_REF_NAME" "build/xenobladeport-${GITHUB_REF_NAME}.apk" --clobber
